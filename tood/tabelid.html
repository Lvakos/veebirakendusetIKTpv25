<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tabelid</title>
  <link rel="stylesheet" href="tableStyle.css">
</head>
<body>
<h1>Tabelid</h1>
<h2>Lihtne tabel</h2>
<table id="lihtne1">
  <tr>
    <td class="nimia">A</td>
    <td>B</td>
  </tr>
  <tr>
    <td>C</td>
    <td>D</td>
  </tr>

</table>

<h2>
  Tabel kus on ühendayud lahtrid

</h2>
<table id="keeruline1">
  <tr>
    <td colspan="2" class="nimia">A</td>
  </tr>
  <tr>
    <td>C</td>
    <td>D</td>
  </tr>
</table>

<h2>Veel üks tabel kus on ühendatud lahtrid</h2>

<table id="keeruline2">
  <tr>
    <td rowspan="2" class="nimia">A</td>
    <td>B</td>
  </tr>
  <tr>
    <td>D</td>
  </tr>
</table>

<h2>Iseseisev Töö Tabeliga</h2>

<table id="iseseisevTooTabeliga">
  <tr>
    <td rowspan="4">A</td>
    <td colspan="5">B</td>
  </tr>
  <tr>
    <td>C</td>
    <td>D</td>
    <td rowspan="3" class = "E">E</td>
  </tr>
  <tr>
    <td colspan="2">F</td>
  </tr>
  <tr>
    <td colspan="2">G</td>
  </tr>
</table>

</body>
</html>
