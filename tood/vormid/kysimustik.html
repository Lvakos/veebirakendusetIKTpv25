<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
    <link rel="stylesheet" href="vormStyle.css">
    <script src="../js/kysimustikScript.js"></script>
</head>
<body>
<h1>Muusika küsimustik</h1>
<div>HTML vormid ja nupud</div>
<form action="#">
    <!-- c + tab komentaar -->
    <table>
        <tr>

            <td>
                <!-- Tekstcast -->
                <label for="nimi">Nimi:</label>
            </td>   <!-- Tekstcast -->
            <td>
                <input type="text" id="nimi" placeholder="Maksimilian" oninput="nimiLugemineKastist()">
            </td>
            <td>
                <div id="vastus1">Sisestatud nimi on: </div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="stiil">Vali meeldivaim muusikakastiil</label>
            </td>
            <!-- ripploend või rippmenüü (выпадающий список) -->
            <td>
                <select name="stiil" id="stiil" onchange="selectvalik()">
                    <option value="vali">vali...</option>
                    <option value="Hiphop">Hiphop</option>
                    <option value="kantri">kantri</option>
                    <option value="rock">rock</option>
                    <option value="funk">funk</option>
                    <option value="metal">metal</option>
                </select>
            </td>
            <td>
                <div id="vastus5"></div>
            </td>
        </tr>
        <tr>
            <!-- radionupp -->
            <td>
                Kuidas sa muusikat peamiselt kuulad?
            </td>
            <td>
                <br>
                <input type="radio" name="platvorm" id="spotify" value="spotify" onclick="radioValik()">
                <label for="spotify">Spotify</label>
                <br>
                <input type="radio" name="platvorm" id="raadio" value="raadio" onclick="radioValik()">
                <label for="raadio">raadio</label>
                <br>
                <input type="radio" name="platvorm" id="vinüülplaat" value="vinüülplaat" onclick="radioValik()">
                <label for="vinüülplaat">vinüülplaat</label>
            </td>
            <td>
                <div id="vastus2"></div>
            </td>
        </tr>
        <tr><!-- checkbox -->
            <td>
                <fieldset>
                    <legend>Tee oma valikud - lemmik ansambel</legend>
                    <input type="checkbox" name="lemmikud" id="radiohead" value="Radiohead" onchange="checkboxValik()">
                    <label for="radiohead">Radiohead</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="rollingstones" value="Rolling Stones" onchange="checkboxValik()">
                    <label for="rollingstones">Rolling Stones</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="thesmiths" value="The Smiths" onchange="checkboxValik()">
                    <label for="thesmiths">The Smiths</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="thesmashingpumpkins" value="The Smashing Pumpkins" onchange="checkboxValik()">
                    <label for="thesmashingpumpkins">The Smashing Pumpkins</label>
                </fieldset>
            </td>
            <td>
                <div id="vastus3"></div>
            </td>
        </tr>
        <!-- range -->
        <tr>
            <td>
                <label for="tund">
                    Mitu tundi päevas sa kuulad muusikat
                </label>
            </td>

            <td>0<input type="range" id="tund" min="0" max="24" value="12" onchange="rangeValik()">24</td>
            <td>
                <div id="vastus4"></div>
            </td>
        </tr>
        <!-- värv -->
        <tr>
            <td>
                <label for="colorr">
                    Milline värv teie lemmik ansamblis logo
                </label>
            </td>
            <td colspan="2">
                <input type="color" id="colorr">
            </td>
        </tr>

        <!-- emaili textbox -->
        <tr>
            <td>
                <label for="emaili">
                    Kirjuta teie lemmik ansambli email
                </label>
            </td>
            <td colspan="2">
                <input type="email" id="emaili">
            </td>
        </tr>

        <!-- kuupäev ja aasta -->
        <tr>
            <td>
                <label for="dates">
                    Millal su lemmikbänd alustas?
                </label>
            </td>
            <td colspan="2">
                <input type="date" id="dates">
            </td>
        </tr>

        <!-- faili lisamine -->
        <tr>
            <td>
                <label for="logos">
                    Lisa teie lemmikbänd logo
                </label>
            </td>
            <td colspan="2">
                <input type="file" id="logos">
            </td>
        </tr>

        <!-- tühjendage kõik andmed -->
        <tr>
            <td>
                <label for="resets">
                    Kustuta kõik kirjutatud andmed
                </label>
            </td>
            <td colspan="2">
                <input type="reset" id="resets" onclick= "puhasta()">
            </td>
        </tr>

        <!-- submit vorm -->
        <tr>
            <td>
                <label for="submits">
                    Saada vorm
                </label>
            </td>
            <td colspan="2">
                <input type="button" id="submits" value = "Kuva kõik" onclick = "naitaKoike()">
            </td>
        </tr>
        <tr>
            <td colspan="3">
                <div>
                    <div id="vastusKoik"></div>
                </div>
            </td>
        </tr>

    </table>
    <br>
</form>
</body>
</html>
