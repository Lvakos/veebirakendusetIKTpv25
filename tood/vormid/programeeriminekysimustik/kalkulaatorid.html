<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kalkulaatorid</title>
    <link rel="stylesheet" href="kalkStyle.css">
    <script src="kalk1Script.js"></script>
    <script src="kalk2Script.js"></script>
    <script src="kalk3Script.js"></script>
</head>
<body>
<h1>Kalkulaatorid</h1>
<section id = "yld">
    <section id="kalk1">
        <h2>meetri/tolli kalkulaator</h2>
        <label for="arv">Sisesta arv</label>
        <input type="number" id="arv" min="1" max="100" step="1" value="10" onchange="teisendamine()">
        <br>
        <input type="radio" name="valik" id="meeter" value="meeter">
        <label for="meeter">Meeter</label>
        <br>
        <input type="radio" name="valik" id="tolli" value="tolli">
        <label for="tolli">Tolli</label>
        <br>
        <div id="vastus">Vastus</div>
        <img id="img" src="" alt="pilt">
    </section>
    <section id="kalk2">
        <h2>Joogi kalkulaator</h2>
        <label for="kogus"> Mitu tk soovid: </label>
        <input type="number" id="kogus" min="1" max="100" step="1" value="10" onchange ="jookideValik()">
        <label for="joogiValik">Vali lemmikjook:</label>
        <select name="joogiValik" id="joogiValik">
            <option value="">vali</option>
            <option value="kohv">kohv</option>
            <option value="vesi">vesi</option>
            <option value="limonaad">limonaad</option>
            <option value="piim">piim</option>
        </select>
        <div id="vastus2">Vastus</div>
    </section>
    <section id="kalk3">
        <h2>Kütusekulu kalkulaator</h2>
        <label for="km"> Mitu km sa sõitsid: </label>
        <input type="text" id="km" placeholder="nt 150" oninput="kytuseArvutus()">
        <br>
        <label for="kulu"> Kütusekulu (l/100 km): </label>
        <input type="text" id="kulu" placeholder="nt 7" oninput="kytuseArvutus()">
        <br>
        <label for="kytusValik">Vali kütus:</label>
        <select name="kytusValik" id="kytusValik" onchange="kytuseArvutus()">
            <option value="">vali</option>
            <option value="bensiin95">bensiin 95</option>
            <option value="bensiin98">bensiin 98</option>
            <option value="diisel">diisel</option>
        </select>
        <div id="vastus3">Vastus</div>
        <img id="img1" src="" alt="pilt">
    </section>
</section>
</body>
</html>
