<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Piltide vahetus JS abil</title>
    <link rel="stylesheet" href="piltStyle.css">
    <script src="../js/piltScript.js"></script>
</head>
<body onload="juhuslikPilt()">
<!--Paint: 4 pilti: smile.png, neutral.png, kurb.png, lill.png-->

<h1>JuhuslikPilt</h1>
<img src="../photos/lill.png" alt="" id="randomPilt">
<br>
<input type="button" onclick="juhuslikPilt()" value="Vaheta pilt">
<section id="myistatus">
    <h2>Mõistatus. Arva äva mida näed pildil?</h2>
    <label for="valik">Tee oma valik</label>
    <select name="valik" id="valik" onchange="selectValik()">
        <option value="vali...">vali</option>
        <option value="../photos/smile.png">Smile</option>
        <option value="../photos/neutral.png">Neutral</option>
        <option value="../photos/kurb.png">Kurb</option>
        <option value="../photos/lill.png">Lill</option>
    </select>
    <div id="vastus">Siia tuleb vastus</div>
</section>
<section id="valik2">
    <input type="radio" name="piltValik" id="v1" value="../photos/smile.png" onclick="radioValik()">
    <label for="v1">Smile</label>
    <br>
    <input type="radio" name="piltValik" id="v2" value="../photos/neutral.png" onclick="radioValik()">
    <label for="v2">Neutral</label>
    <br>
    <input type="radio" name="piltValik" id="v3" value="../photos/kurb.png" onclick="radioValik()">
    <label for="v3">Kurb</label>
    <br>
    <input type="radio" name="piltValik" id="v4" value="../photos/lill.png" onclick="radioValik()">
    <label for="v4">Lill</label>
    <br>
    <img src="" alt="" id="valitudPilt">
</section>

</body>
</html>
